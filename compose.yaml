services:
  db:
    image: postgres:18
    container_name: entornos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: entornos-db
    volumes:
      - db-data:/var/lib/postgresql
    # El esquema y los datos de prueba los crea Prisma, no Postgres: corré
    # `pnpm db:setup` (o `pnpm db:fresh` para empezar de cero). El contenedor
    # solo se encarga de levantar la base vacía.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entornos-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
